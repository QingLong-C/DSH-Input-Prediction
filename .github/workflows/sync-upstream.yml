name: Review upstream and release merged changes

on:
  schedule:
    # Beijing 09:17 and 21:17; GitHub may delay scheduled runs.
    - cron: '17 1,13 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: upstream-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Avoid replacing an open review
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("upstream-review/"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare upstream candidate
        if: steps.open.outputs.count == '0'
        id: sync
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/sync-upstream.py
      - name: Regression on candidate
        if: steps.sync.outputs.changed == 'true'
        id: tests
        continue-on-error: true
        run: bash .github/scripts/check-regression.sh
      - name: Save review candidate including failed checks
        if: always() && steps.sync.outputs.changed == 'true'
        env:
          BASE: ${{ steps.sync.outputs.base }}
          PASSED: ${{ steps.tests.outcome }}
          ARTIFACT_DIR: ${{ runner.temp }}/candidate
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Prepare upstream changes for human review'
          mkdir -p "$ARTIFACT_DIR"
          git bundle create "$ARTIFACT_DIR/source.bundle" HEAD
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          data = {'base': os.environ['BASE'], 'commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'passed': os.environ['PASSED']=='success', 'version': json.loads(Path('package.json').read_text())['version']}
          (Path(os.environ['ARTIFACT_DIR'])/'proposal.json').write_text(json.dumps(data))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.sync.outputs.changed == 'true'
        with:
          name: review-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7

  propose:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: review-candidate
          path: ${{ runner.temp }}/candidate
      - name: Open PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/candidate
        run: python3 .github/scripts/propose-upstream.py

  regression:
    name: Prediction regression
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: bash .github/scripts/check-regression.sh
      - name: Verify merged release artifact
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.sha }}
          CHANGED: 'false'
          ARTIFACT_DIR: ${{ runner.temp }}/release
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          mkdir -p "$ARTIFACT_DIR"
          npm pack --json --pack-destination "$ARTIFACT_DIR"
          python3 scripts/verify-release.py
          git bundle create "$ARTIFACT_DIR/source.bundle" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push'
        with:
          name: tested-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-release
          path: ${{ runner.temp }}/release
      - env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/release
        run: python3 .github/scripts/publish-release.py
